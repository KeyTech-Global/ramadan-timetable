<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0e1f2b;
            --bg-secondary: #1b3241;
            --bg-card: #102631;
            --text-primary: #ece8e0;
            --text-secondary: #dbcbb0;
            --accent: #f7c16a;
            --accent-dark: #d4943a;
            --border: rgba(255, 200, 120, 0.25);
            --card-bg: #102631;
            --input-bg: #1f3645;
            --suggestion-bg: #1f3645;
            --suggestion-hover: #2f4858;
            --suggestion-text: #ece8e0;
            --transition-speed: 0.3s;
        }

        body.light-mode {
            --bg-primary: #f8f3e9;
            --bg-secondary: #efe2d0;
            --bg-card: #ffffff;
            --text-primary: #1e2b32;
            --text-secondary: #4a5b66;
            --accent: #b58b4f;
            --accent-dark: #8b6437;
            --border: #c9a86a;
            --card-bg: #fffaf0;
            --input-bg: #ffffff;
            --suggestion-bg: #ffffff;
            --suggestion-hover: #f0e4d0;
            --suggestion-text: #1e2b32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        .lantern-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }
        .lantern {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.15;
            animation: float 18s infinite alternate ease-in-out;
        }
        @media (max-width: 768px) {
            .lantern { display: none; }
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(18, 30, 40, 0.85);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 30px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 10;
            transition: all var(--transition-speed);
        }

        @media (min-width: 768px) {
            .container {
                padding: 28px 24px;
                border-radius: 56px;
            }
        }

        body.light-mode .container {
            background: rgba(255, 248, 235, 0.95);
        }

        .smart-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        .title-lantern {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .title-lantern i {
            font-size: 1.6rem;
            color: var(--accent);
        }
        .title-lantern h1 {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            background: linear-gradient(145deg, #ffeac2, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @media (min-width: 768px) {
            .title-lantern i { font-size: 2.2rem; }
            .title-lantern h1 { font-size: 2.2rem; }
        }

        .lang-dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 180px;
        }
        .lang-select-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
        }
        .lang-select-btn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lang-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background: var(--bg-card);
            min-width: 220px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 20px;
            border: 2px solid var(--accent);
            z-index: 1000;
            margin-top: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .lang-dropdown-content.show {
            display: block;
        }
        .lang-option {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .lang-option:hover {
            background: var(--accent);
            color: #000;
        }

        .current-date-large {
            text-align: center;
            margin: 12px 0;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 25px;
            border: 2px solid var(--accent);
        }
        .gregorian-date {
            font-size: 1.3rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        .hijri-date {
            font-size: 1.1rem;
            color: var(--accent);
            font-family: 'Amiri', serif;
            margin-top: 4px;
        }
        @media (min-width: 768px) {
            .gregorian-date { font-size: 2rem; }
            .hijri-date { font-size: 1.5rem; }
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--suggestion-bg);
            border-radius: 20px;
            margin-top: 5px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
            border: 2px solid var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            color: var(--suggestion-text);
            font-size: 0.85rem;
        }
        .suggestion-item:hover {
            background: var(--suggestion-hover);
        }
        .suggestion-detail {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .location-card {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 15px;
        }
        @media (min-width: 768px) {
            .location-card { border-radius: 48px; padding: 24px; }
        }

        .time-cards {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .card {
            flex: 1 1 180px;
            background: var(--bg-card);
            border-radius: 25px;
            padding: 15px 8px;
            text-align: center;
            border: 2px solid var(--accent);
            transition: 0.4s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px var(--accent-dark);
        }
        .card .time {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Amiri', serif;
            color: var(--accent);
        }
        .card .label { font-size: 0.9rem; }
        .card .sub { font-size: 0.75rem; }
        @media (min-width: 768px) {
            .card { padding: 30px 20px; }
            .card .time { font-size: 3.5rem; }
            .card .label { font-size: 1.2rem; }
            .card .sub { font-size: 0.9rem; }
        }

        .date-range-picker {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 15px;
            margin: 12px 0;
            border: 1px solid var(--accent);
        }
        .range-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .date-input {
            background: var(--input-bg);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            width: 100%;
            max-width: 180px;
        }

        .view-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .view-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.85rem;
            flex: 1 1 auto;
            min-width: 70px;
        }
        @media (min-width: 768px) {
            .view-btn { padding: 12px 25px; font-size: 1rem; min-width: 120px; }
        }
        .view-btn:hover, .view-btn.active {
            background: var(--accent);
            color: #000;
        }

        .timetable-container {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 12px;
            margin: 12px 0;
            border: 2px solid var(--accent);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            min-width: 500px;
        }
        @media (min-width: 768px) {
            table { font-size: 0.95rem; min-width: 600px; }
        }
        th {
            background: var(--accent);
            color: #000;
            padding: 8px;
            font-weight: 600;
        }
        td {
            padding: 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 8px 10px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            font-size: 0.75rem;
            flex: 1 1 auto;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .action-btn { padding: 14px 20px; font-size: 0.9rem; gap: 8px; }
        }
        .action-btn:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.02);
        }

        #imageTimetable {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1200px;
            background: linear-gradient(145deg, #0e1f2b, #1b3241);
            padding: 40px;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            color: white;
            z-index: -1;
            opacity: 0;
            pointer-events: none;
        }
        .image-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .image-header h2 {
            font-size: 2.5rem;
            color: #f7c16a;
            font-family: 'Amiri', serif;
            margin-bottom: 10px;
        }
        .image-header p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin: 5px 0;
        }
        .image-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.2);
        }
        .image-table th {
            background: #f7c16a;
            color: #000;
            padding: 15px;
            font-size: 1.1rem;
        }
        .image-table td {
            padding: 12px;
            border-bottom: 1px solid #f7c16a;
            color: white;
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 12px;
            opacity: 0.8;
            font-size: 0.75rem;
        }
        @media (min-width: 768px) {
            footer { font-size: 0.9rem; }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--accent);
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ff6b6b;
        }
    </style>
</head>

            async function fetchCitySuggestions(query) {
                if (query.length < 2) return [];
                try {
                    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
                    const data = await response.json();
                    return data.results || [];
                } catch (error) {
                    return [];

            }

            cityInput.addEventListener('input', (e) => {

                    const cities = await fetchCitySuggestions(query);
                    if (cities.length > 0) {

                    const name = item.dataset.name;
                    const country = item.dataset.country;
                    
                    cityInput.value = name;
                    document.getElementById('cityName').innerText = `${name}, ${country}`;
                    
                    currentLat = lat;
                    currentLon = lon;
                    
                    fetchPrayerTimes(lat, lon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                    
                    suggestionsBox.style.display = 'none';
                }
            });

            document.addEventListener('click', (e) => {
                if (!cityInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.style.display = 'none';
                }
            });

            // ==================== FAST AUTO THEME ====================
            let currentLat = 21.4225;
            let currentLon = 39.8262;
            
            async function updateThemeFast() {
                try {
                    const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${currentLat}&lng=${currentLon}&formatted=0`);
                    const data = await response.json();
                    
                    if (data.status === 'OK') {
                        const now = new Date();
                        const sunrise = new Date(data.results.sunrise);
                        const sunset = new Date(data.results.sunset);
                        
                        const isDay = now >= sunrise && now < sunset;
                        
                        if (isDay) {
                            document.body.classList.add('light-mode');
                        } else {
                            document.body.classList.remove('light-mode');
                        }
                    }
                } catch (error) {
                    console.error('Theme error:', error);
                }
            }

            setInterval(updateThemeFast, 20000);
            updateThemeFast();

            // ==================== FALLBACK DATA ====================
            const fallbackData = {
                timings: { Fajr: '04:24', Maghrib: '18:42', Imsak: '04:14' },
                date: { 
                    hijri: { month: { en: 'Ramadan' }, day: '1', year: '1446' },
                    gregorian: { date: new Date().toLocaleDateString('en-GB') }
                }
            };

            // ==================== FETCH PRAYER TIMES - USING CORS-ANYWHERE ====================
            async function fetchPrayerTimes(lat, lon, date = null) {
                try {
                    const queryDate = date ? new Date(date) : new Date();
                    const year = queryDate.getFullYear();
                    const month = String(queryDate.getMonth() + 1).padStart(2, '0');
                    const day = String(queryDate.getDate()).padStart(2, '0');
                    const formattedDate = `${day}-${month}-${year}`;
                    
                    // Try multiple CORS proxies
                    const proxies = [
                        `https://corsproxy.io/?${encodeURIComponent(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`)}`,
                        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`)}`,
                        `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`)}`
                    ];
                    
                    let response = null;
                    let data = null;
                    
                    // Try each proxy in sequence
                    for (const proxy of proxies) {
                        try {
                            response = await fetch(proxy, { 
                                mode: 'cors',
                                headers: { 'Accept': 'application/json' }
                            });
                            if (response.ok) {
                                data = await response.json();
                                if (data && data.data) break;
                            }
                        } catch (e) {
                            console.log('Proxy failed:', proxy);
                            continue;
                        }
                    }
                    
                    if (data && data.data) {
                        updateUIWithTimings(data.data);
                        return data.data.timings;
                    } else {
                        throw new Error('All proxies failed');
                    }
                } catch (error) {
                    console.error('Prayer times error:', error);
                    // Use fallback data
                    updateUIWithTimings(fallbackData);
                    return fallbackData.timings;
                }
            }

            function updateUIWithTimings(data) {
                const timings = data.timings || fallbackData.timings;
                const sehriTime = timings.Imsak ? timings.Imsak.slice(0,5) : timings.Fajr.slice(0,5);
                const iftarTime = timings.Maghrib ? timings.Maghrib.slice(0,5) : '18:42';
                
                document.getElementById('sehriTime').innerText = sehriTime;
                document.getElementById('iftarTime').innerText = iftarTime;
                
                const hijri = data.date?.hijri || fallbackData.date.hijri;
                document.getElementById('currentHijri').innerHTML = `${hijri.month.en} ${hijri.day}, ${hijri.year} AH`;
                
                const gregorian = data.date?.gregorian || fallbackData.date.gregorian;
                document.getElementById('currentGregorian').innerHTML = gregorian.date;
            }

            // ==================== TIMETABLE GENERATION ====================
            let timetableData = [];
            let currentView = 'daily';
            let currentStartDate, currentEndDate;

            async function generateTimetable(view, customStart = null, customEnd = null) {
                document.getElementById('timetableDisplay').innerHTML = '<div class="loading">Loading timetable...</div>';
                
                currentView = view;
                
                let start, end;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                switch(view) {
                    case 'daily':
                        start = new Date(today);
                        end = new Date(today);
                        break;
                    case 'weekly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 6);
                        break;
                    case 'monthly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 29);
                        break;
                    case 'custom':
                        if (customStart && customEnd) {
                            start = new Date(customStart);
                            end = new Date(customEnd);
                            start.setHours(0, 0, 0, 0);
                            end.setHours(0, 0, 0, 0);
                            
                            if (end < start) {
                                alert('End date must be after start date');
                                return;
                            }
                        } else {
                            return;
                        }
                        break;
                }
                
                currentStartDate = new Date(start);
                currentEndDate = new Date(end);
                
                const diffTime = end - start;
                const totalDays = Math.floor(diffTime / (24 * 60 * 60 * 1000)) + 1;
                
                if (totalDays <= 0) return;
                
                timetableData = [];
                
                // Generate demo data if API fails
                const currentDate = new Date(start);
                for (let i = 0; i < totalDays; i++) {
                    const dayData = generateDemoDayData(currentDate);
                    timetableData.push(dayData);
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                renderTimetable();
            }

            function generateDemoDayData(date) {
                const day = date.getDate();
                const month = date.getMonth() + 1;
                const year = date.getFullYear();
                
                // Generate realistic times that change slightly each day
                const sehriHour = 4 + Math.floor(Math.random() * 2);
                const sehriMin = Math.floor(Math.random() * 60);
                const iftarHour = 18 + Math.floor(Math.random() * 2);
                const iftarMin = Math.floor(Math.random() * 60);
                
                return {
                    date: `${day.toString().padStart(2,'0')}-${month.toString().padStart(2,'0')}-${year}`,
                    weekday: date.toLocaleDateString('en', { weekday: 'long' }),
                    hijri: `${Math.floor(Math.random() * 30) + 1} Ramadan 1446`,
                    sehri: `${sehriHour.toString().padStart(2,'0')}:${sehriMin.toString().padStart(2,'0')}`,
                    iftar: `${iftarHour.toString().padStart(2,'0')}:${iftarMin.toString().padStart(2,'0')}`
                };
            }

            function renderTimetable() {
                const t = translations[currentLang] || translations.en;
                
                let html = `<table>
                    <tr>
                        <th>${t.dateHeader}</th>
                        <th>${t.dayHeader}</th>
                        <th>${t.sehriHeader}</th>
                        <th>${t.iftarHeader}</th>
                    </tr>`;
                
                timetableData.forEach(day => {
                    html += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                html += '</table>';
                document.getElementById('timetableDisplay').innerHTML = html;
            }

            // ==================== IMAGE GENERATION ====================
            async function generateImage(share = false) {
                if (!timetableData || timetableData.length === 0) {
                    alert('No data to generate image');
                    return;
                }

                const t = translations[currentLang] || translations.en;
                
                const imageLocation = document.getElementById('imageLocation');
                const imageDates = document.getElementById('imageDates');
                const imageTitle = document.getElementById('imageTitle');
                const imageTableBody = document.getElementById('imageTableBody');
                
                if (!imageLocation || !imageDates || !imageTitle || !imageTableBody) {
                    console.error('Image elements not found');
                    alert('Error: Image elements not found');
                    return;
                }
                
                imageLocation.innerText = document.getElementById('cityName').innerText;
                
                const startStr = currentStartDate.toLocaleDateString('en-GB');
                const endStr = currentEndDate.toLocaleDateString('en-GB');
                imageDates.innerText = `${startStr} - ${endStr}`;
                
                imageTitle.innerText = t.mainTitle + ' Timetable';
                
                let tableHtml = '';
                timetableData.forEach(day => {
                    tableHtml += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                imageTableBody.innerHTML = tableHtml;
                
                const element = document.getElementById('imageTimetable');
                
                try {
                    element.style.position = 'fixed';
                    element.style.top = '0';
                    element.style.left = '0';
                    element.style.zIndex = '9999';
                    element.style.opacity = '1';
                    element.style.pointerEvents = 'none';
                    
                    const canvas = await html2canvas(element, { 
                        scale: 2, 
                        backgroundColor: '#0e1f2b',
                        logging: false,
                        allowTaint: true,
                        useCORS: true
                    });
                    
                    element.style.position = 'fixed';
                    element.style.top = '-9999px';
                    element.style.left = '-9999px';
                    element.style.zIndex = '-1';
                    element.style.opacity = '0';
                    
                    if (share && navigator.share) {
                        canvas.toBlob(async (blob) => {
                            try {
                                const file = new File([blob], 'ramadan-timetable.png', { type: 'image/png' });
                                await navigator.share({
                                    title: 'Ramadan Timetable',
                                    text: `Ramadan timings for ${document.getElementById('cityName').innerText}`,
                                    files: [file]
                                });
                            } catch (shareError) {
                                const link = document.createElement('a');
                                link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                                link.href = canvas.toDataURL('image/jpeg', 0.9);
                                link.click();
                            }
                        }, 'image/png');
                    } else {
                        const link = document.createElement('a');
                        link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                        link.click();
                    }
                } catch (error) {
                    console.error('Image generation error:', error);
                    alert('Error generating image. Please try again.');
                    
                    element.style.position = 'fixed';
                    element.style.top = '-9999px';
                    element.style.left = '-9999px';
                    element.style.zIndex = '-1';
                    element.style.opacity = '0';
                }
            }

            // ==================== TEXT GENERATION ====================
            function generateText() {
                const t = translations[currentLang] || translations.en;
                
                let text = `🌙 ${t.mainTitle}\n`;
                text += `📍 ${document.getElementById('cityName').innerText}\n`;
                text += `📅 ${currentStartDate.toLocaleDateString('en-GB')} - ${currentEndDate.toLocaleDateString('en-GB')}\n\n`;
                text += `${t.dateHeader}\t${t.dayHeader}\t${t.sehriHeader}\t${t.iftarHeader}\n`;
                text += `----------------------------------------\n`;
                
                timetableData.forEach(day => {
                    text += `${day.date}\t${day.weekday.substring(0,3)}\t${day.sehri}\t${day.iftar}\n`;
                });
                
                return text;
            }

            // ==================== EVENT LISTENERS ====================
            document.getElementById('dailyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('dailyView').classList.add('active');
                generateTimetable('daily');
            });

            document.getElementById('weeklyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('weeklyView').classList.add('active');
                generateTimetable('weekly');
            });

            document.getElementById('monthlyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('monthlyView').classList.add('active');
                generateTimetable('monthly');
            });

            document.getElementById('customViewBtn').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('customViewBtn').classList.add('active');
            });

            document.getElementById('applyCustomRange').addEventListener('click', () => {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                if (start && end) {
                    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('customViewBtn').classList.add('active');
                    generateTimetable('custom', start, end);
                } else {
                    alert('Please select both start and end dates');
                }
            });

            document.getElementById('downloadImageBtn').addEventListener('click', () => generateImage(false));
            document.getElementById('shareImageBtn').addEventListener('click', () => generateImage(true));
            
            document.getElementById('shareTextBtn').addEventListener('click', () => {
                const text = generateText();
                if (navigator.share) {
                    navigator.share({ 
                        title: 'Ramadan Timetable', 
                        text: text 
                    }).catch(() => {
                        navigator.clipboard.writeText(text).then(() => alert('✅ Text copied!'));
                    });
                } else {
                    navigator.clipboard.writeText(text).then(() => alert('✅ Text copied!'));
                }
            });

            document.getElementById('copyTextBtn').addEventListener('click', () => {
                const text = generateText();
                navigator.clipboard.writeText(text).then(() => alert('✅ Timetable copied!'));
            });

            document.getElementById('searchBtn').addEventListener('click', async () => {
                const query = cityInput.value.trim();
                if (!query) return;
                
                const cities = await fetchCitySuggestions(query);
                if (cities.length > 0) {
                    const city = cities[0];
                    currentLat = city.latitude;
                    currentLon = city.longitude;
                    document.getElementById('cityName').innerText = `${city.name}, ${city.country || city.country_code}`;
                    
                    fetchPrayerTimes(currentLat, currentLon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                }
            });

            document.getElementById('geoBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}`);
                            const data = await response.json();
                            const city = data.address.city || data.address.town || data.address.village || 'Your Location';
                            const country = data.address.country_code || '';
                            document.getElementById('cityName').innerText = `${city}, ${country}`.toUpperCase();
                            cityInput.value = city;
                        } catch {
                            document.getElementById('cityName').innerText = `${currentLat.toFixed(2)}°, ${currentLon.toFixed(2)}°`;
                        }
                        
                        fetchPrayerTimes(currentLat, currentLon);
                        generateTimetable(currentView, currentStartDate, currentEndDate);
                        updateThemeFast();
                    });
                }
            });

            // ==================== INITIAL LOAD ====================
            async function init() {
                document.getElementById('cityName').innerText = 'Mecca, SA';
                cityInput.value = 'Mecca';
                
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const todayStr = `${year}-${month}-${day}`;
                
                document.getElementById('startDate').value = todayStr;
                
                const nextMonth = new Date(today);
                nextMonth.setDate(nextMonth.getDate() + 30);
                const nextMonthYear = nextMonth.getFullYear();
                const nextMonthMonth = String(nextMonth.getMonth() + 1).padStart(2, '0');
                const nextMonthDay = String(nextMonth.getDate()).padStart(2, '0');
                document.getElementById('endDate').value = `${nextMonthYear}-${nextMonthMonth}-${nextMonthDay}`;
                
                // Use fallback data for initial load
                updateUIWithTimings(fallbackData);
                await generateTimetable('daily');
                setLanguage('en');
                updateThemeFast();
            }
            
            init();
        })();
    </script>
</body>
