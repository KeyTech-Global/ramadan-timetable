<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌙 Ramadan Complete · Fully Responsive · All Views Fixed</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CSS variables */
        :root {
            --bg-primary: #0e1f2b;
            --bg-secondary: #1b3241;
            --bg-card: #102631;
            --text-primary: #ece8e0;
            --text-secondary: #dbcbb0;
            --accent: #f7c16a;
            --accent-dark: #d4943a;
            --border: rgba(255, 200, 120, 0.25);
            --card-bg: #102631;
            --input-bg: #1f3645;
            --suggestion-bg: #1f3645;
            --suggestion-hover: #2f4858;
            --suggestion-text: #ece8e0;
            --transition-speed: 0.3s;
        }

        body.light-mode {
            --bg-primary: #f8f3e9;
            --bg-secondary: #efe2d0;
            --bg-card: #ffffff;
            --text-primary: #1e2b32;
            --text-secondary: #4a5b66;
            --accent: #b58b4f;
            --accent-dark: #8b6437;
            --border: #c9a86a;
            --card-bg: #fffaf0;
            --input-bg: #ffffff;
            --suggestion-bg: #ffffff;
            --suggestion-hover: #f0e4d0;
            --suggestion-text: #1e2b32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        /* Floating decorations - hidden on small devices */
        .lantern-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }
        .lantern {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.15;
            animation: float 18s infinite alternate ease-in-out;
        }
        @media (max-width: 768px) {
            .lantern {
                display: none;
            }
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(18, 30, 40, 0.85);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 10;
            transition: all var(--transition-speed);
        }

        @media (min-width: 768px) {
            .container {
                padding: 28px 24px;
                border-radius: 56px;
            }
        }

        body.light-mode .container {
            background: rgba(255, 248, 235, 0.95);
        }

        /* Header */
        .smart-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 15px;
        }
        .title-lantern {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .title-lantern i {
            font-size: 1.8rem;
            color: var(--accent);
        }
        .title-lantern h1 {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            background: linear-gradient(145deg, #ffeac2, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @media (min-width: 768px) {
            .title-lantern i { font-size: 2.2rem; }
            .title-lantern h1 { font-size: 2.2rem; }
        }

        /* Language dropdown */
        .lang-dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 200px;
        }
        .lang-select-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 10px 15px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
        }
        .lang-select-btn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lang-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background: var(--bg-card);
            min-width: 250px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 20px;
            border: 2px solid var(--accent);
            z-index: 1000;
            margin-top: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .lang-dropdown-content.show {
            display: block;
        }
        .lang-option {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .lang-option:hover {
            background: var(--accent);
            color: #000;
        }

        /* Current date */
        .current-date-large {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: var(--bg-card);
            border-radius: 30px;
            border: 2px solid var(--accent);
        }
        .gregorian-date {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        .hijri-date {
            font-size: 1.2rem;
            color: var(--accent);
            font-family: 'Amiri', serif;
            margin-top: 5px;
        }
        @media (min-width: 768px) {
            .gregorian-date { font-size: 2rem; }
            .hijri-date { font-size: 1.5rem; }
        }

        /* Location search */
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--suggestion-bg);
            border-radius: 20px;
            margin-top: 5px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
            border: 2px solid var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            color: var(--suggestion-text);
            font-size: 0.9rem;
        }
        .suggestion-item:hover {
            background: var(--suggestion-hover);
        }
        .suggestion-detail {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Location card */
        .location-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .location-card { border-radius: 48px; padding: 24px; }
        }

        /* Time cards */
        .time-cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .card {
            flex: 1 1 200px;
            background: var(--bg-card);
            border-radius: 30px;
            padding: 20px 10px;
            text-align: center;
            border: 2px solid var(--accent);
            transition: 0.4s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px var(--accent-dark);
        }
        .card .time {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Amiri', serif;
            color: var(--accent);
        }
        .card .label {
            font-size: 1rem;
        }
        .card .sub {
            font-size: 0.8rem;
        }
        @media (min-width: 768px) {
            .card { padding: 30px 20px; }
            .card .time { font-size: 3.5rem; }
            .card .label { font-size: 1.2rem; }
            .card .sub { font-size: 0.9rem; }
        }

        /* Date range picker */
        .date-range-picker {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid var(--accent);
        }
        .range-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .date-input {
            background: var(--input-bg);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 10px 15px;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            max-width: 200px;
        }

        /* View buttons */
        .view-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        .view-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 8px 15px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.9rem;
            flex: 1 1 auto;
            min-width: 80px;
        }
        @media (min-width: 768px) {
            .view-btn { padding: 12px 25px; font-size: 1rem; min-width: 120px; }
        }
        .view-btn:hover, .view-btn.active {
            background: var(--accent);
            color: #000;
        }

        /* Timetable - Responsive */
        .timetable-container {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid var(--accent);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 500px;
        }
        @media (min-width: 768px) {
            table { font-size: 0.95rem; min-width: 600px; }
        }
        th {
            background: var(--accent);
            color: #000;
            padding: 10px;
            font-weight: 600;
        }
        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        /* Action buttons - Responsive */
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 10px 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            font-size: 0.8rem;
            flex: 1 1 auto;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .action-btn { padding: 14px 20px; font-size: 0.9rem; gap: 8px; }
        }
        .action-btn:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.02);
        }

        /* Hidden image generator */
        #imageTimetable {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1000px;
            background: linear-gradient(145deg, #0e1f2b, #1b3241);
            padding: 40px;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .image-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .image-header h2 {
            font-size: 2.5rem;
            color: #f7c16a;
            font-family: 'Amiri', serif;
        }
        .image-table {
            width: 100%;
            border-collapse: collapse;
        }
        .image-table th {
            background: #f7c16a;
            color: #000;
            padding: 12px;
            font-size: 1rem;
        }
        .image-table td {
            padding: 10px;
            border-bottom: 1px solid #f7c16a;
            color: white;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 15px;
            opacity: 0.8;
            font-size: 0.8rem;
        }
        @media (min-width: 768px) {
            footer { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <!-- Floating lanterns - hidden on mobile -->
    <div class="lantern-bg">
        <div class="lantern" style="top: 10%; left: 5%;">🏮</div>
        <div class="lantern" style="top: 70%; left: 90%;">🏮</div>
        <div class="lantern" style="top: 40%; left: 80%;">🪔</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="smart-header">
            <div class="title-lantern">
                <i class="fas fa-moon"></i>
                <i class="fas fa-lantern"></i>
                <h1 id="mainTitle">Ramadan</h1>
            </div>
            <div class="lang-dropdown">
                <button class="lang-select-btn" id="langDropdownBtn">
                    <i class="fas fa-globe"></i>
                    <span id="selectedLang">English</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="lang-dropdown-content" id="langDropdownContent"></div>
            </div>
        </div>

        <!-- Current date -->
        <div class="current-date-large">
            <div class="gregorian-date" id="currentGregorian">Loading...</div>
            <div class="hijri-date" id="currentHijri">Loading...</div>
        </div>

        <!-- Location search -->
        <div class="location-card">
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px;">
                <i class="fas fa-search-location" style="color: var(--accent); font-size: 1.2rem;"></i>
                <div class="search-wrapper" style="flex: 3; min-width: 200px;">
                    <input type="text" id="cityInput" placeholder="Search city..." 
                           style="width: 100%; background: var(--input-bg); border: 2px solid var(--accent); border-radius: 50px; padding: 12px 15px; color: var(--text-primary); font-size: 0.9rem;">
                    <div id="suggestionsBox" class="suggestions-box"></div>
                </div>
                <button id="searchBtn" class="view-btn" style="padding: 10px 12px;"><i class="fas fa-search"></i></button>
                <button id="geoBtn" class="view-btn" style="padding: 10px 12px;"><i class="fas fa-crosshairs"></i></button>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.9rem;">
                <span><i class="fas fa-map-marker-alt"></i> <span id="cityName">Loading...</span></span>
                <span><i class="fas fa-clock"></i> <span id="timezone"></span></span>
            </div>
        </div>

        <!-- Main prayer times -->
        <div class="time-cards">
            <div class="card">
                <i class="fas fa-cloud-sun" style="font-size: 2rem; color: var(--accent);"></i>
                <div class="label" id="labelSehri">SEHRI</div>
                <div class="time" id="sehriTime">--:--</div>
                <div class="sub" id="subSehri">last time to eat</div>
            </div>
            <div class="card">
                <i class="fas fa-sun" style="font-size: 2rem; color: var(--accent);"></i>
                <div class="label" id="labelIftar">IFTAR</div>
                <div class="time" id="iftarTime">--:--</div>
                <div class="sub" id="subIftar">break fast time</div>
            </div>
        </div>

        <!-- Date range picker -->
        <div class="date-range-picker">
            <div class="range-controls">
                <div style="width: 100%; max-width: 200px;">
                    <label id="fromLabel" style="font-size: 0.8rem;">From:</label>
                    <input type="date" id="startDate" class="date-input">
                </div>
                <div style="width: 100%; max-width: 200px;">
                    <label id="toLabel" style="font-size: 0.8rem;">To:</label>
                    <input type="date" id="endDate" class="date-input">
                </div>
                <button class="view-btn" id="applyCustomRange" style="padding: 10px 15px;"><i class="fas fa-calendar-check"></i> <span id="applyRangeText">Apply</span></button>
            </div>
        </div>

        <!-- View buttons -->
        <div class="view-buttons">
            <button class="view-btn active" id="dailyView">Daily</button>
            <button class="view-btn" id="weeklyView">Weekly</button>
            <button class="view-btn" id="monthlyView">Monthly</button>
            <button class="view-btn" id="customViewBtn">Custom</button>
        </div>

        <!-- Timetable -->
        <div class="timetable-container">
            <div id="timetableDisplay"></div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <button class="action-btn" id="downloadImageBtn"><i class="fas fa-download"></i> <span id="downloadText">JPEG</span></button>
            <button class="action-btn" id="shareImageBtn"><i class="fas fa-share-alt"></i> <span id="shareImageText">Share Img</span></button>
            <button class="action-btn" id="shareTextBtn"><i class="fas fa-file-alt"></i> <span id="shareText">Share Text</span></button>
            <button class="action-btn" id="copyTextBtn"><i class="fas fa-copy"></i> <span id="copyText">Copy</span></button>
        </div>

        <!-- Footer -->
        <footer id="footerNote">Ramadan Timetable · All Languages · Auto Theme</footer>
    </div>

    <!-- Hidden timetable for image generation -->
    <div id="imageTimetable">
        <div class="image-header">
            <h2 id="imageTitle">Ramadan Timetable</h2>
            <p id="imageLocation"></p>
            <p id="imageDates"></p>
        </div>
        <table class="image-table" id="imageTable">
            <tr>
                <th id="imageDateHeader">Date</th>
                <th id="imageDayHeader">Day</th>
                <th id="imageSehriHeader">Sehri</th>
                <th id="imageIftarHeader">Iftar</th>
            </tr>
        </table>
    </div>

                { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
                { code: 'ru', name: 'Русский', flag: '🇷🇺' },
                { code: 'zh', name: '中文', flag: '🇨🇳' },
                { code: 'hi', name: 'हिन्दी', flag: '🇮🇳' }
            ];

            // Populate dropdown
            const langDropdownContent = document.getElementById('langDropdownContent');
            languages.forEach(lang => {
                const option = document.createElement('div');
                option.className = 'lang-option';
                option.dataset.lang = lang.code;
                option.innerHTML = `${lang.flag} ${lang.name}`;
                option.onclick = () => setLanguage(lang.code);
                langDropdownContent.appendChild(option);
            });

            // Toggle dropdown
            document.getElementById('langDropdownBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('langDropdownContent').classList.toggle('show');
            });

            document.addEventListener('click', () => {
                document.getElementById('langDropdownContent').classList.remove('show');
            });

            let currentLang = 'en';
            
            function setLanguage(code) {
                currentLang = code;
                const t = translations[code] || translations.en;
                const selectedLang = languages.find(l => l.code === code) || languages[0];
                
                // Update UI
                document.getElementById('mainTitle').innerText = t.mainTitle;
                document.getElementById('labelSehri').innerText = t.sehri;
                document.getElementById('labelIftar').innerText = t.iftar;
                document.getElementById('subSehri').innerText = t.subSehri;
                document.getElementById('subIftar').innerText = t.subIftar;
                document.getElementById('dailyView').innerText = t.daily;
                document.getElementById('weeklyView').innerText = t.weekly;
                document.getElementById('monthlyView').innerText = t.monthly;
                document.getElementById('customViewBtn').innerText = t.custom;
                document.getElementById('fromLabel').innerText = t.from;
                document.getElementById('toLabel').innerText = t.to;
                document.getElementById('applyRangeText').innerText = t.applyRange;
                document.getElementById('downloadText').innerText = t.download;
                document.getElementById('shareImageText').innerText = t.shareImage;
                document.getElementById('shareText').innerText = t.shareText;
                document.getElementById('copyText').innerText = t.copyText;
                document.getElementById('footerNote').innerText = t.footer;
                document.getElementById('selectedLang').innerHTML = `${selectedLang.flag} ${selectedLang.name}`;
                document.getElementById('cityInput').placeholder = t.searchPlaceholder;
                
                // Update image headers
                document.getElementById('imageTitle').innerText = t.mainTitle + ' Timetable';
                document.getElementById('imageDateHeader').innerText = t.dateHeader;
                document.getElementById('imageDayHeader').innerText = t.dayHeader;
                document.getElementById('imageSehriHeader').innerText = t.sehriHeader;
                document.getElementById('imageIftarHeader').innerText = t.iftarHeader;
                
                if (timetableData.length > 0) renderTimetable();
            }

            // ==================== LOCATION SUGGESTIONS ====================
            const cityInput = document.getElementById('cityInput');
            const suggestionsBox = document.getElementById('suggestionsBox');
            let suggestionTimeout;

            async function fetchCitySuggestions(query) {
                if (query.length < 2) return [];
                try {
                    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
                    const data = await response.json();
                    return data.results || [];
                } catch (error) {
                    return [];
                }
            }

            cityInput.addEventListener('input', (e) => {
                clearTimeout(suggestionTimeout);
                const query = e.target.value.trim();
                if (query.length < 2) {
                    suggestionsBox.style.display = 'none';
                    return;
                }
                
                suggestionTimeout = setTimeout(async () => {
                    const cities = await fetchCitySuggestions(query);
                    if (cities.length > 0) {
                        suggestionsBox.innerHTML = cities.map(city => `
                            <div class="suggestion-item" data-lat="${city.latitude}" data-lon="${city.longitude}" data-name="${city.name}" data-country="${city.country || city.country_code}">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <strong>${city.name}</strong>
                                    <div class="suggestion-detail">${city.country || ''}${city.admin1 ? ', ' + city.admin1 : ''}</div>
                                </div>
                            </div>
                        `).join('');
                        suggestionsBox.style.display = 'block';
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                }, 300);
            });

            suggestionsBox.addEventListener('click', (e) => {
                const item = e.target.closest('.suggestion-item');
                if (item && item.dataset.lat) {
                    const lat = parseFloat(item.dataset.lat);
                    const lon = parseFloat(item.dataset.lon);
                    const name = item.dataset.name;
                    const country = item.dataset.country;
                    
                    cityInput.value = name;
                    document.getElementById('cityName').innerText = `${name}, ${country}`;
                    
                    currentLat = lat;
                    currentLon = lon;
                    
                    fetchPrayerTimes(lat, lon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                    
                    suggestionsBox.style.display = 'none';
                }
            });

            document.addEventListener('click', (e) => {
                if (!cityInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.style.display = 'none';
                }
            });

            // ==================== FAST AUTO THEME ====================
            let currentLat = 21.4225;
            let currentLon = 39.8262;
            
            async function updateThemeFast() {
                try {
                    const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${currentLat}&lng=${currentLon}&formatted=0`);
                    const data = await response.json();
                    
                    if (data.status === 'OK') {
                        const now = new Date();
                        const sunrise = new Date(data.results.sunrise);
                        const sunset = new Date(data.results.sunset);
                        
                        const isDay = now >= sunrise && now < sunset;
                        
                        if (isDay) {
                            document.body.classList.add('light-mode');
                        } else {
                            document.body.classList.remove('light-mode');
                        }
                    }
                } catch (error) {
                    console.error('Theme error:', error);
                }
            }

            setInterval(updateThemeFast, 20000);
            updateThemeFast();

            // ==================== FETCH PRAYER TIMES ====================
            async function fetchPrayerTimes(lat, lon, date = null) {
                try {
                    const queryDate = date ? new Date(date) : new Date();
                    const day = String(queryDate.getDate()).padStart(2, '0');
                    const month = String(queryDate.getMonth() + 1).padStart(2, '0');
                    const year = queryDate.getFullYear();
                    const formattedDate = `${day}-${month}-${year}`;
                    
                    const response = await fetch(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`);
                    const data = await response.json();
                    
                    if (data.code === 200) {
                        const timings = data.data.timings;
                        
                        const sehriTime = timings.Imsak ? timings.Imsak.slice(0,5) : timings.Fajr.slice(0,5);
                        const iftarTime = timings.Maghrib.slice(0,5);
                        
                        document.getElementById('sehriTime').innerText = sehriTime;
                        document.getElementById('iftarTime').innerText = iftarTime;
                        
                        const hijri = data.data.date.hijri;
                        document.getElementById('currentHijri').innerHTML = `${hijri.month.en} ${hijri.day}, ${hijri.year} AH`;
                        
                        const gregorian = data.data.date.gregorian;
                        document.getElementById('currentGregorian').innerHTML = gregorian.date;
                        
                        return timings;
                    }
                } catch (error) {
                    console.error('Prayer times error:', error);
                }
            }

            // ==================== TIMETABLE GENERATION - FIXED ====================
            let timetableData = [];
            let currentView = 'daily';
            let currentStartDate, currentEndDate;

            async function generateTimetable(view, customStart = null, customEnd = null) {
                currentView = view;
                
                let start, end;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                switch(view) {
                    case 'daily':
                        start = new Date(today);
                        end = new Date(today);
                        break;
                    case 'weekly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 6);
                        break;
                    case 'monthly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 29); // Exactly 30 days including today
                        break;
                    case 'custom':
                        if (customStart && customEnd) {
                            start = new Date(customStart);
                            end = new Date(customEnd);
                            start.setHours(0, 0, 0, 0);
                            end.setHours(0, 0, 0, 0);
                        } else {
                            return;
                        }
                        break;
                }
                
                // Ensure end date is not before start date
                if (end < start) {
                    alert('End date must be after start date');
                    return;
                }
                
                currentStartDate = new Date(start);
                currentEndDate = new Date(end);
                
                // Calculate total days correctly
                const totalDays = Math.floor((end - start) / (24 * 60 * 60 * 1000)) + 1;
                
                const promises = [];
                const currentDate = new Date(start);
                
                for (let i = 0; i < totalDays; i++) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    promises.push(fetchDayData(currentLat, currentLon, dateStr));
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                const results = await Promise.all(promises);
                timetableData = results.filter(r => r !== null);
                
                renderTimetable();
            }

            async function fetchDayData(lat, lon, dateStr) {
                try {
                    const [year, month, day] = dateStr.split('-');
                    const formattedDate = `${day}-${month}-${year}`;
                    
                    const response = await fetch(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`);
                    const data = await response.json();
                    
                    if (data.code === 200) {
                        const sehriTime = data.data.timings.Imsak ? data.data.timings.Imsak.slice(0,5) : data.data.timings.Fajr.slice(0,5);
                        
                        return {
                            date: data.data.date.gregorian.date,
                            weekday: data.data.date.gregorian.weekday.en,
                            hijri: `${data.data.date.hijri.day} ${data.data.date.hijri.month.en}`,
                            sehri: sehriTime,
                            iftar: data.data.timings.Maghrib.slice(0,5)
                        };
                    }
                } catch (error) {
                    console.error('Error fetching day:', error);
                }
                return null;
            }

            function renderTimetable() {
                const t = translations[currentLang] || translations.en;
                
                let html = `<table>
                    <tr>
                        <th>${t.dateHeader}</th>
                        <th>${t.dayHeader}</th>
                        <th>${t.sehriHeader}</th>
                        <th>${t.iftarHeader}</th>
                    </tr>`;
                
                timetableData.forEach(day => {
                    html += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                html += '</table>';
                document.getElementById('timetableDisplay').innerHTML = html;
            }

            // ==================== IMAGE GENERATION - FIXED ====================
            async function generateImage(share = false) {
                if (!timetableData || timetableData.length === 0) {
                    alert('No data to generate image');
                    return;
                }

                const t = translations[currentLang] || translations.en;
                
                // Update image with current data
                document.getElementById('imageLocation').innerText = document.getElementById('cityName').innerText;
                document.getElementById('imageDates').innerText = `${currentStartDate.toLocaleDateString()} - ${currentEndDate.toLocaleDateString()}`;
                document.getElementById('imageTitle').innerText = t.mainTitle + ' Timetable';
                
                let imageHtml = `<tr>
                    <th>${t.dateHeader}</th>
                    <th>${t.dayHeader}</th>
                    <th>${t.sehriHeader}</th>
                    <th>${t.iftarHeader}</th>
                </tr>`;
                
                timetableData.forEach(day => {
                    imageHtml += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                document.getElementById('imageTable').innerHTML = imageHtml;
                
                const element = document.getElementById('imageTimetable');
                
                try {
                    // Ensure element is visible for capture
                    element.style.position = 'fixed';
                    element.style.top = '0';
                    element.style.left = '0';
                    element.style.zIndex = '-1';
                    
                    const canvas = await html2canvas(element, { 
                        scale: 2, 
                        backgroundColor: '#0e1f2b',
                        logging: false,
                        allowTaint: true,
                        useCORS: true
                    });
                    
                    // Hide it again
                    element.style.position = 'fixed';
                    element.style.top = '-9999px';
                    element.style.left = '-9999px';
                    
                    if (share && navigator.share) {
                        // Convert canvas to blob and share
                        canvas.toBlob(async (blob) => {
                            try {
                                const file = new File([blob], 'ramadan-timetable.png', { type: 'image/png' });
                                await navigator.share({
                                    title: 'Ramadan Timetable',
                                    text: `Ramadan timings for ${document.getElementById('cityName').innerText}`,
                                    files: [file]
                                });
                            } catch (shareError) {
                                console.log('Share cancelled or failed, falling back to download');
                                // Fallback to download
                                const link = document.createElement('a');
                                link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                                link.href = canvas.toDataURL('image/jpeg', 0.9);
                                link.click();
                            }
                        }, 'image/png');
                    } else {
                        // Download directly
                        const link = document.createElement('a');
                        link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                        link.click();
                    }
                } catch (error) {
                    console.error('Image generation error:', error);
                    alert('Error generating image. Please try again.');
                    
                    // Reset element position
                    element.style.position = 'fixed';
                    element.style.top = '-9999px';
                    element.style.left = '-9999px';
                }
            }

            // ==================== TEXT GENERATION ====================
            function generateText() {
                const t = translations[currentLang] || translations.en;
                
                let text = `🌙 ${t.mainTitle}\n`;
                text += `📍 ${document.getElementById('cityName').innerText}\n`;
                text += `📅 ${currentStartDate.toLocaleDateString()} - ${currentEndDate.toLocaleDateString()}\n\n`;
                text += `${t.dateHeader}\t${t.dayHeader}\t${t.sehriHeader}\t${t.iftarHeader}\n`;
                text += `----------------------------------------\n`;
                
                timetableData.forEach(day => {
                    text += `${day.date}\t${day.weekday.substring(0,3)}\t${day.sehri}\t${day.iftar}\n`;
                });
                
                return text;
            }

            // ==================== EVENT LISTENERS ====================
            document.getElementById('dailyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('dailyView').classList.add('active');
                generateTimetable('daily');
            });

            document.getElementById('weeklyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('weeklyView').classList.add('active');
                generateTimetable('weekly');
            });

            document.getElementById('monthlyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('monthlyView').classList.add('active');
                generateTimetable('monthly');
            });

            document.getElementById('customViewBtn').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('customViewBtn').classList.add('active');
            });

            document.getElementById('applyCustomRange').addEventListener('click', () => {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                if (start && end) {
                    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('customViewBtn').classList.add('active');
                    generateTimetable('custom', start, end);
                } else {
                    alert('Please select both start and end dates');
                }
            });

            document.getElementById('downloadImageBtn').addEventListener('click', () => generateImage(false));
            document.getElementById('shareImageBtn').addEventListener('click', () => generateImage(true));
            
            document.getElementById('shareTextBtn').addEventListener('click', () => {
                const text = generateText();
                if (navigator.share) {
                    navigator.share({ 
                        title: 'Ramadan Timetable', 
                        text: text 
                    }).catch(() => {
                        // Fallback to copy
                        navigator.clipboard.writeText(text).then(() => alert('✅ Text copied!'));
                    });
                } else {
                    navigator.clipboard.writeText(text).then(() => alert('✅ Text copied!'));
                }
            });

            document.getElementById('copyTextBtn').addEventListener('click', () => {
                const text = generateText();
                navigator.clipboard.writeText(text).then(() => alert('✅ Timetable copied!'));
            });

            document.getElementById('searchBtn').addEventListener('click', async () => {
                const query = cityInput.value.trim();
                if (!query) return;
                
                const cities = await fetchCitySuggestions(query);
                if (cities.length > 0) {
                    const city = cities[0];
                    currentLat = city.latitude;
                    currentLon = city.longitude;
                    document.getElementById('cityName').innerText = `${city.name}, ${city.country || city.country_code}`;
                    
                    fetchPrayerTimes(currentLat, currentLon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                }
            });

            document.getElementById('geoBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}`);
                            const data = await response.json();
                            const city = data.address.city || data.address.town || data.address.village || 'Your Location';
                            const country = data.address.country_code || '';
                            document.getElementById('cityName').innerText = `${city}, ${country}`.toUpperCase();
                            cityInput.value = city;
                        } catch {
                            document.getElementById('cityName').innerText = `${currentLat.toFixed(2)}°, ${currentLon.toFixed(2)}°`;
                        }
                        
                        fetchPrayerTimes(currentLat, currentLon);
                        generateTimetable(currentView, currentStartDate, currentEndDate);
                        updateThemeFast();
                    });
                }
            });

            // ==================== INITIAL LOAD ====================
            async function init() {
                document.getElementById('cityName').innerText = 'Mecca, SA';
                cityInput.value = 'Mecca';
                
                // Set default dates
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const todayStr = `${year}-${month}-${day}`;
                
                document.getElementById('startDate').value = todayStr;
                
                const nextMonth = new Date(today);
                nextMonth.setDate(nextMonth.getDate() + 30);
                const nextMonthYear = nextMonth.getFullYear();
                const nextMonthMonth = String(nextMonth.getMonth() + 1).padStart(2, '0');
                const nextMonthDay = String(nextMonth.getDate()).padStart(2, '0');
                document.getElementById('endDate').value = `${nextMonthYear}-${nextMonthMonth}-${nextMonthDay}`;
                
                await fetchPrayerTimes(currentLat, currentLon);
                await generateTimetable('daily');
                setLanguage('en');
                updateThemeFast();
            }
            
            init();
        })();
    </script>
</body>
</html>
