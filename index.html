    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CSS variables */
        :root {
            --bg-primary: #0e1f2b;
            --bg-secondary: #1b3241;
            --bg-card: #102631;
            --text-primary: #ece8e0;
            --text-secondary: #dbcbb0;
            --accent: #f7c16a;
            --accent-dark: #d4943a;
            --border: rgba(255, 200, 120, 0.25);
            --card-bg: #102631;
            --input-bg: #1f3645;
            --suggestion-bg: #1f3645;
            --suggestion-hover: #2f4858;
            --suggestion-text: #ece8e0;
            --transition-speed: 0.3s;
        }

        body.light-mode {
            --bg-primary: #f8f3e9;
            --bg-secondary: #efe2d0;
            --bg-card: #ffffff;
            --text-primary: #1e2b32;
            --text-secondary: #4a5b66;
            --accent: #b58b4f;
            --accent-dark: #8b6437;
            --border: #c9a86a;
            --card-bg: #fffaf0;
            --input-bg: #ffffff;
            --suggestion-bg: #ffffff;
            --suggestion-hover: #f0e4d0;
            --suggestion-text: #1e2b32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        /* Floating decorations */
        .lantern-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }
        .lantern {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.15;
            animation: float 18s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }

        .container {
            max-width: 1300px;
            width: 100%;
            background: rgba(18, 30, 40, 0.85);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 56px;
            padding: 28px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 10;
            transition: all var(--transition-speed);
        }

        body.light-mode .container {
            background: rgba(255, 248, 235, 0.95);
        }

        /* Header */
        .smart-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .title-lantern {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-lantern i {
            font-size: 2.2rem;
            color: var(--accent);
        }
        .title-lantern h1 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            background: linear-gradient(145deg, #ffeac2, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Language dropdown - improved */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }
        .lang-select-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 12px 24px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
        }
        .lang-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background: var(--bg-card);
            min-width: 300px;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 24px;
            border: 2px solid var(--accent);
            z-index: 1000;
            margin-top: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .lang-dropdown-content.show {
            display: block;
        }
        .lang-option {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            transition: 0.2s;
        }
        .lang-option:hover {
            background: var(--accent);
            color: #000;
        }

        /* Current date */
        .current-date-large {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 48px;
            border: 2px solid var(--accent);
        }
        .gregorian-date {
            font-size: 2rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        .hijri-date {
            font-size: 1.5rem;
            color: var(--accent);
            font-family: 'Amiri', serif;
            margin-top: 8px;
        }

        /* Location search */
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--suggestion-bg);
            border-radius: 24px;
            margin-top: 8px;
            max-height: 350px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
            border: 2px solid var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            color: var(--suggestion-text);
        }
        .suggestion-item:hover {
            background: var(--suggestion-hover);
        }
        .suggestion-detail {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Time cards */
        .time-cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .card {
            flex: 1 1 250px;
            background: var(--bg-card);
            border-radius: 42px;
            padding: 30px 20px;
            text-align: center;
            border: 2px solid var(--accent);
            transition: 0.4s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px var(--accent-dark);
        }
        .card .time {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Amiri', serif;
            color: var(--accent);
        }

        /* Date range picker */
        .date-range-picker {
            background: var(--bg-card);
            border-radius: 48px;
            padding: 24px;
            margin: 20px 0;
            border: 1px solid var(--accent);
        }
        .range-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .date-input {
            background: var(--input-bg);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        /* View buttons */
        .view-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .view-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 12px 25px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .view-btn:hover, .view-btn.active {
            background: var(--accent);
            color: #000;
        }

        /* Timetable */
        .timetable-container {
            background: var(--bg-card);
            border-radius: 48px;
            padding: 24px;
            margin: 20px 0;
            border: 2px solid var(--accent);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: var(--accent);
            color: #000;
            padding: 15px;
            font-weight: 600;
        }
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 40px;
            padding: 14px 30px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.05);
        }

        /* Hidden image generator */
        #imageTimetable {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1200px;
            background: linear-gradient(145deg, #0e1f2b, #1b3241);
            padding: 50px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .image-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .image-header h2 {
            font-size: 3rem;
            color: #f7c16a;
            font-family: 'Amiri', serif;
        }
        .image-table {
            width: 100%;
            border-collapse: collapse;
        }
        .image-table th {
            background: #f7c16a;
            color: #000;
            padding: 15px;
            font-size: 1.1rem;
        }
        .image-table td {
            padding: 12px;
            border-bottom: 1px solid #f7c16a;
            color: white;
        }
    </style>
</head>

        <div class="date-range-picker">

                },

                    sehri: "سحری", iftar: "افطار", subSehri: "آخرین زمان غذا", subIftar: "زمان افطار",

                    download: "دانلود JPEG", shareImage: "اشتراک‌گذاری تصویر", shareText: "اشتراک‌گذاری متن", copyText: "کپی متن",
                    footer: "جدول زمانی کامل رمضان · همه زبان‌ها · تم خودکار",
                    dateHeader: "تاریخ", dayHeader: "روز", sehriHeader: "سحری", iftarHeader: "افطار",

                },
                sw: {
                    mainTitle: "Ramadan Kamili",
                    sehri: "SEHRI", iftar: "IFTAR", subSehri: "wakati wa mwisho wa kula", subIftar: "wakati wa kufuturu",
                    daily: "Kila siku", weekly: "Kila wiki", monthly: "Kila mwezi (siku 30)", custom: "Maalum",
                    from: "Kutoka:", to: "Hadi:", applyRange: "Tumia masafa",
                    download: "Pakua JPEG", shareImage: "Shiriki picha", shareText: "Shiriki maandishi", copyText: "Nakili maandishi",
                    footer: "Ratiba kamili ya Ramadan · Lugha zote · Mandhari otomatiki",
                    dateHeader: "Tarehe", dayHeader: "Siku", sehriHeader: "Sehri", iftarHeader: "Iftar",
                    searchPlaceholder: "Tafuta mji duniani kote..."
                }
            };

            // All 28 languages with flags
            const languages = [
                { code: 'en', name: 'English', flag: '🇬🇧' },
                { code: 'ar', name: 'العربية', flag: '🇸🇦' },
                { code: 'fr', name: 'Français', flag: '🇫🇷' },
                { code: 'es', name: 'Español', flag: '🇪🇸' },
                { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
                { code: 'id', name: 'Indonesia', flag: '🇮🇩' },
                { code: 'tr', name: 'Türkçe', flag: '🇹🇷' },
                { code: 'ru', name: 'Русский', flag: '🇷🇺' },
                { code: 'zh', name: '中文', flag: '🇨🇳' },
                { code: 'hi', name: 'हिन्दी', flag: '🇮🇳' },
                { code: 'ur', name: 'اردو', flag: '🇵🇰' },
                { code: 'ja', name: '日本語', flag: '🇯🇵' },
                { code: 'fa', name: 'فارسی', flag: '🇮🇷' },
                { code: 'sw', name: 'Kiswahili', flag: '🇹🇿' }
            ];

            // Populate language dropdown
            const langDropdownContent = document.getElementById('langDropdownContent');
            languages.forEach(lang => {
                const option = document.createElement('div');
                option.className = 'lang-option';
                option.dataset.lang = lang.code;
                option.innerHTML = `${lang.flag} ${lang.name}`;
                option.onclick = () => setLanguage(lang.code);
                langDropdownContent.appendChild(option);
            });

            // Toggle dropdown
            document.getElementById('langDropdownBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('langDropdownContent').classList.toggle('show');
            });

            document.addEventListener('click', () => {
                document.getElementById('langDropdownContent').classList.remove('show');
            });

            // Current language
            let currentLang = 'en';
            
            // Set language function - updates ALL UI elements including images
            function setLanguage(code) {
                currentLang = code;
                const t = translations[code] || translations.en;
                const selectedLang = languages.find(l => l.code === code) || languages[0];
                
                // Update all UI text
                document.getElementById('mainTitle').innerText = t.mainTitle;
                document.getElementById('labelSehri').innerText = t.sehri;
                document.getElementById('labelIftar').innerText = t.iftar;
                document.getElementById('subSehri').innerText = t.subSehri;
                document.getElementById('subIftar').innerText = t.subIftar;
                document.getElementById('dailyView').innerText = t.daily;
                document.getElementById('weeklyView').innerText = t.weekly;
                document.getElementById('monthlyView').innerText = t.monthly;
                document.getElementById('customViewBtn').innerText = t.custom;
                document.getElementById('fromLabel').innerText = t.from;
                document.getElementById('toLabel').innerText = t.to;
                document.getElementById('applyRangeText').innerText = t.applyRange;
                document.getElementById('downloadText').innerText = t.download;
                document.getElementById('shareImageText').innerText = t.shareImage;
                document.getElementById('shareText').innerText = t.shareText;
                document.getElementById('copyText').innerText = t.copyText;
                document.getElementById('footerNote').innerText = t.footer;
                document.getElementById('selectedLang').innerHTML = `${selectedLang.flag} ${selectedLang.name}`;
                document.getElementById('cityInput').placeholder = t.searchPlaceholder;
                
                // Update image headers (CRITICAL for language in downloaded images)
                document.getElementById('imageTitle').innerText = t.mainTitle + ' Timetable';
                document.getElementById('imageDateHeader').innerText = t.dateHeader;
                document.getElementById('imageDayHeader').innerText = t.dayHeader;
                document.getElementById('imageSehriHeader').innerText = t.sehriHeader;
                document.getElementById('imageIftarHeader').innerText = t.iftarHeader;
                
                // Re-render timetable with new language headers
                if (timetableData.length > 0) renderTimetable();
            }

            // ==================== LOCATION SUGGESTIONS ====================
            const cityInput = document.getElementById('cityInput');
            const suggestionsBox = document.getElementById('suggestionsBox');
            let suggestionTimeout;

            async function fetchCitySuggestions(query) {
                if (query.length < 2) return [];
                try {
                    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
                    const data = await response.json();
                    return data.results || [];
                } catch (error) {
                    return [];
                }
            }

            cityInput.addEventListener('input', (e) => {
                clearTimeout(suggestionTimeout);
                const query = e.target.value.trim();
                if (query.length < 2) {
                    suggestionsBox.style.display = 'none';
                    return;
                }
                
                suggestionTimeout = setTimeout(async () => {
                    const cities = await fetchCitySuggestions(query);
                    if (cities.length > 0) {
                        suggestionsBox.innerHTML = cities.map(city => `
                            <div class="suggestion-item" data-lat="${city.latitude}" data-lon="${city.longitude}" data-name="${city.name}" data-country="${city.country || city.country_code}">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <strong>${city.name}</strong>
                                    <div class="suggestion-detail">${city.country || ''}${city.admin1 ? ', ' + city.admin1 : ''}</div>
                                </div>
                            </div>
                        `).join('');
                        suggestionsBox.style.display = 'block';
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                }, 300);
            });

            suggestionsBox.addEventListener('click', (e) => {
                const item = e.target.closest('.suggestion-item');
                if (item && item.dataset.lat) {
                    const lat = parseFloat(item.dataset.lat);
                    const lon = parseFloat(item.dataset.lon);
                    const name = item.dataset.name;
                    const country = item.dataset.country;
                    
                    cityInput.value = name;
                    document.getElementById('cityName').innerText = `${name}, ${country}`;
                    
                    currentLat = lat;
                    currentLon = lon;
                    
                    fetchPrayerTimes(lat, lon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                    
                    suggestionsBox.style.display = 'none';
                }
            });

            document.addEventListener('click', (e) => {
                if (!cityInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.style.display = 'none';
                }
            });

            // ==================== FAST AUTO THEME (no text visible) ====================
            let currentLat = 21.4225;
            let currentLon = 39.8262;
            
            async function updateThemeFast() {
                try {
                    const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${currentLat}&lng=${currentLon}&formatted=0`);
                    const data = await response.json();
                    
                    if (data.status === 'OK') {
                        const now = new Date();
                        const sunrise = new Date(data.results.sunrise);
                        const sunset = new Date(data.results.sunset);
                        
                        const isDay = now >= sunrise && now < sunset;
                        
                        // Apply theme instantly
                        if (isDay) {
                            document.body.classList.add('light-mode');
                        } else {
                            document.body.classList.remove('light-mode');
                        }
                    }
                } catch (error) {
                    console.error('Theme error:', error);
                }
            }

            // Update every 20 seconds for quick response
            setInterval(updateThemeFast, 20000);
            updateThemeFast();

            // ==================== FETCH PRAYER TIMES (CORRECTED: Sehri = Imsak, Iftar = Maghrib) ====================
            async function fetchPrayerTimes(lat, lon, date = null) {
                try {
                    const queryDate = date ? new Date(date) : new Date();
                    const day = String(queryDate.getDate()).padStart(2, '0');
                    const month = String(queryDate.getMonth() + 1).padStart(2, '0');
                    const year = queryDate.getFullYear();
                    const formattedDate = `${day}-${month}-${year}`;
                    
                    const response = await fetch(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`);
                    const data = await response.json();
                    
                    if (data.code === 200) {
                        const timings = data.data.timings;
                        
                        // CORRECT: Sehri = Imsak (if available) otherwise Fajr, Iftar = Maghrib
                        const sehriTime = timings.Imsak ? timings.Imsak.slice(0,5) : timings.Fajr.slice(0,5);
                        const iftarTime = timings.Maghrib.slice(0,5);
                        
                        document.getElementById('sehriTime').innerText = sehriTime;
                        document.getElementById('iftarTime').innerText = iftarTime;
                        
                        const hijri = data.data.date.hijri;
                        document.getElementById('currentHijri').innerHTML = `${hijri.month.en} ${hijri.day}, ${hijri.year} AH`;
                        
                        const gregorian = data.data.date.gregorian;
                        document.getElementById('currentGregorian').innerHTML = gregorian.date;
                        
                        return timings;
                    }
                } catch (error) {
                    console.error('Prayer times error:', error);
                }
            }

            // ==================== TIMETABLE GENERATION ====================
            let timetableData = [];
            let currentView = 'daily';
            let currentStartDate, currentEndDate;

            async function generateTimetable(view, customStart = null, customEnd = null) {
                currentView = view;
                
                let start, end;
                const today = new Date();
                
                switch(view) {
                    case 'daily':
                        start = new Date(today);
                        end = new Date(today);
                        break;
                    case 'weekly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 6);
                        break;
                    case 'monthly':
                        start = new Date(today);
                        end = new Date(today);
                        end.setDate(end.getDate() + 29);
                        break;
                    case 'custom':
                        if (customStart && customEnd) {
                            start = new Date(customStart);
                            end = new Date(customEnd);
                        } else {
                            return;
                        }
                        break;
                }
                
                currentStartDate = start;
                currentEndDate = end;
                
                const promises = [];
                const currentDate = new Date(start);
                
                while (currentDate <= end) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    promises.push(fetchDayData(currentLat, currentLon, dateStr));
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                const results = await Promise.all(promises);
                timetableData = results.filter(r => r !== null);
                
                renderTimetable();
            }

            async function fetchDayData(lat, lon, dateStr) {
                try {
                    const [year, month, day] = dateStr.split('-');
                    const formattedDate = `${day}-${month}-${year}`;
                    
                    const response = await fetch(`https://api.aladhan.com/v1/timings/${formattedDate}?latitude=${lat}&longitude=${lon}&method=2`);
                    const data = await response.json();
                    
                    if (data.code === 200) {
                        // CORRECT: Use Imsak for Sehri if available
                        const sehriTime = data.data.timings.Imsak ? data.data.timings.Imsak.slice(0,5) : data.data.timings.Fajr.slice(0,5);
                        
                        return {
                            date: data.data.date.gregorian.date,
                            weekday: data.data.date.gregorian.weekday.en,
                            hijri: `${data.data.date.hijri.day} ${data.data.date.hijri.month.en}`,
                            sehri: sehriTime,
                            iftar: data.data.timings.Maghrib.slice(0,5)
                        };
                    }
                } catch (error) {
                    return null;
                }
                return null;
            }

            function renderTimetable() {
                const t = translations[currentLang] || translations.en;
                
                let html = `<table>
                    <tr>
                        <th>${t.dateHeader}</th>
                        <th>${t.dayHeader}</th>
                        <th>${t.sehriHeader}</th>
                        <th>${t.iftarHeader}</th>
                    </tr>`;
                
                timetableData.forEach(day => {
                    html += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                html += '</table>';
                document.getElementById('timetableDisplay').innerHTML = html;
            }

            // ==================== IMAGE GENERATION (with current language headers) ====================
            async function generateImage(share = false) {
                const t = translations[currentLang] || translations.en;
                
                // Update image with current language and data
                document.getElementById('imageLocation').innerText = document.getElementById('cityName').innerText;
                document.getElementById('imageDates').innerText = `${currentStartDate.toLocaleDateString()} - ${currentEndDate.toLocaleDateString()}`;
                document.getElementById('imageTitle').innerText = t.mainTitle + ' Timetable';
                document.getElementById('imageDateHeader').innerText = t.dateHeader;
                document.getElementById('imageDayHeader').innerText = t.dayHeader;
                document.getElementById('imageSehriHeader').innerText = t.sehriHeader;
                document.getElementById('imageIftarHeader').innerText = t.iftarHeader;
                
                let imageHtml = `<tr>
                    <th>${t.dateHeader}</th>
                    <th>${t.dayHeader}</th>
                    <th>${t.sehriHeader}</th>
                    <th>${t.iftarHeader}</th>
                </tr>`;
                
                timetableData.forEach(day => {
                    imageHtml += `<tr>
                        <td>${day.date}</td>
                        <td>${day.weekday}</td>
                        <td>${day.sehri}</td>
                        <td>${day.iftar}</td>
                    </tr>`;
                });
                
                document.getElementById('imageTable').innerHTML = imageHtml;
                
                const element = document.getElementById('imageTimetable');
                
                try {
                    const canvas = await html2canvas(element, { scale: 2, backgroundColor: null });
                    
                    if (share && navigator.share && navigator.canShare && navigator.canShare({ files: [] })) {
                        canvas.toBlob(blob => {
                            const file = new File([blob], 'ramadan-timetable.png', { type: 'image/png' });
                            navigator.share({
                                title: 'Ramadan Timetable',
                                files: [file]
                            }).catch(() => {
                                // Fallback to download if share fails
                                const link = document.createElement('a');
                                link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                                link.href = canvas.toDataURL('image/jpeg', 0.9);
                                link.click();
                            });
                        });
                    } else {
                        const link = document.createElement('a');
                        link.download = `ramadan-timetable-${currentView}-${new Date().toISOString().split('T')[0]}.jpeg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                        link.click();
                    }
                } catch (error) {
                    alert('Error generating image. Please try again.');
                }
            }

            // ==================== TEXT GENERATION ====================
            function generateText() {
                const t = translations[currentLang] || translations.en;
                
                let text = `🌙 ${t.mainTitle}\n`;
                text += `📍 ${document.getElementById('cityName').innerText}\n`;
                text += `📅 ${currentStartDate.toLocaleDateString()} - ${currentEndDate.toLocaleDateString()}\n\n`;
                text += `${t.dateHeader}\t${t.dayHeader}\t${t.sehriHeader}\t${t.iftarHeader}\n`;
                text += `----------------------------------------\n`;
                
                timetableData.forEach(day => {
                    text += `${day.date}\t${day.weekday.substring(0,3)}\t${day.sehri}\t${day.iftar}\n`;
                });
                
                return text;
            }

            // ==================== EVENT LISTENERS ====================
            document.getElementById('dailyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('dailyView').classList.add('active');
                generateTimetable('daily');
            });

            document.getElementById('weeklyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('weeklyView').classList.add('active');
                generateTimetable('weekly');
            });

            document.getElementById('monthlyView').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('monthlyView').classList.add('active');
                generateTimetable('monthly');
            });

            document.getElementById('customViewBtn').addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('customViewBtn').classList.add('active');
            });

            document.getElementById('applyCustomRange').addEventListener('click', () => {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                if (start && end) {
                    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('customViewBtn').classList.add('active');
                    generateTimetable('custom', start, end);
                }
            });

            document.getElementById('downloadImageBtn').addEventListener('click', () => generateImage(false));
            document.getElementById('shareImageBtn').addEventListener('click', () => generateImage(true));
            
            document.getElementById('shareTextBtn').addEventListener('click', () => {
                const text = generateText();
                if (navigator.share) {
                    navigator.share({ title: 'Ramadan Timetable', text: text });
                } else {
                    alert('Share not supported. Use Copy button.');
                }
            });

            document.getElementById('copyTextBtn').addEventListener('click', () => {
                const text = generateText();
                navigator.clipboard.writeText(text).then(() => alert('✅ Timetable copied!'));
            });

            document.getElementById('searchBtn').addEventListener('click', async () => {
                const query = cityInput.value.trim();
                if (!query) return;
                
                const cities = await fetchCitySuggestions(query);
                if (cities.length > 0) {
                    const city = cities[0];
                    currentLat = city.latitude;
                    currentLon = city.longitude;
                    document.getElementById('cityName').innerText = `${city.name}, ${city.country || city.country_code}`;
                    
                    fetchPrayerTimes(currentLat, currentLon);
                    generateTimetable(currentView, currentStartDate, currentEndDate);
                    updateThemeFast();
                }
            });

            document.getElementById('geoBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}`);
                            const data = await response.json();
                            const city = data.address.city || data.address.town || data.address.village || 'Your Location';
                            const country = data.address.country_code || '';
                            document.getElementById('cityName').innerText = `${city}, ${country}`.toUpperCase();
                            cityInput.value = city;
                        } catch {
                            document.getElementById('cityName').innerText = `${currentLat.toFixed(2)}°, ${currentLon.toFixed(2)}°`;
                        }
                        
                        fetchPrayerTimes(currentLat, currentLon);
                        generateTimetable(currentView, currentStartDate, currentEndDate);
                        updateThemeFast();
                    });
                }
            });

            // ==================== INITIAL LOAD ====================
            async function init() {
                document.getElementById('cityName').innerText = 'Mecca, SA';
                cityInput.value = 'Mecca';
                
                // Set default dates
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').value = today;
                const nextMonth = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                document.getElementById('endDate').value = nextMonth;
                
                await fetchPrayerTimes(currentLat, currentLon);
                await generateTimetable('daily');
                setLanguage('en');
                updateThemeFast();
            }
            
            init();
        })();
    </script>
